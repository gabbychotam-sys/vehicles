name: Notify new cases

# Runs every 5 minutes — checks Firebase for cases that the mobile inspectors
# pushed but that haven't triggered an email yet. Sends one email per new case
# to Gabi + Moran. Marks the case in Firebase so it isn't notified twice.
#
# Required secrets:
#   MAIL_USERNAME  — Gmail address that sends the notifications
#   MAIL_PASSWORD  — Gmail App Password (16-char, NOT the regular password)

on:
  schedule:
    # GitHub deprioritizes (and sometimes silently drops) cron jobs scheduled
    # at the top of the hour due to peak load. Per the GitHub Actions docs:
    # "To decrease the chance of delay, schedule your workflow to run at a
    # different time of the hour." This list = every 5 min, offset 2 from
    # the hour edge. Much more reliable than `*/5 * * * *` for low-traffic
    # workflows on personal repos.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:        # also allow manual trigger from the Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: .github/scripts
        run: npm install --silent

      - name: Send notifications
        working-directory: .github/scripts
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          FIREBASE_URL: https://galil-elyon-vehicles-default-rtdb.europe-west1.firebasedatabase.app
          RECIPIENTS: gabbyc@galil-elion.org.il,moranl@galil-elion.org.il
        run: node notify-new-cases.js
